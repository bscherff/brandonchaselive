name: Sync Calendar

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 6:00 AM ET daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install icalendar

      - name: Fetch and parse calendar
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: python scripts/sync_calendar.py

      - name: Commit updated events via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const path = 'data/events.json';

            const newContent = fs.readFileSync(path, 'base64');

            // Get current file SHA (needed for updates)
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                path,
              });
              sha = data.sha;
              if (data.content.replace(/\n/g, '') === newContent) {
                console.log('No changes — skipping commit.');
                return;
              }
            } catch (e) {
              // File doesn't exist yet — first run
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner:   context.repo.owner,
              repo:    context.repo.repo,
              path,
              message: 'chore: sync calendar events',
              content: newContent,
              sha,
            });
            console.log('events.json updated successfully.');
