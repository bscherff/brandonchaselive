name: Sync Calendar

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 6:00 AM ET daily
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install icalendar

      - name: Fetch and parse calendar
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: python scripts/sync_calendar.py

      - name: Commit updated events
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet && echo "No changes to commit." || (
            git commit -m "chore: sync calendar events [skip ci]" &&
            git push
          )
