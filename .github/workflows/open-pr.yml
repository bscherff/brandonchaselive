name: Open PR as bot

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create PR via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');

            // Skip if a PR is already open for this branch
            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              head:  `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (existing.length > 0) {
              console.log(`PR already open: ${existing[0].html_url}`);
              return;
            }

            // Derive title and body from the most recent commit message
            const { execSync } = require('child_process');
            const title = execSync('git log -1 --format=%s').toString().trim();
            const body  = execSync('git log -1 --format=%b').toString().trim();

            const { data: pr } = await github.rest.pulls.create({
              owner:                context.repo.owner,
              repo:                 context.repo.repo,
              title,
              head:                 branch,
              base:                 'main',
              body:                 body || '_No description provided._',
              maintainer_can_modify: true,
            });

            console.log(`PR opened by bot: ${pr.html_url}`);
